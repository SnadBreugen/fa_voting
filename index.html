  body { padding-bottom: calc(var(--bar) + 24px + env(safe-area-inset-bottom)); }

  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 22px; }

  .me .ava { width: 32px; height: 32px; font-size: 12px; }

  /* sections */

  /* nominate */

  @media (max-width: 760px) { .nom-grid { grid-template-columns: 1fr; } }
  .nom-grid .label { display: block; margin-bottom: 8px; }
  input[type=text], textarea {
    width: 100%; background: var(--field); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
    font-family: var(--sans); font-size: 15px; padding: 12px 14px; outline: none;
  }

  ::placeholder { color: #5f6b7c; }
  textarea { height: 100px; resize: none; }
  .preview { height: 64px; display: flex; align-items: center; gap: 12px; margin-top: 10px; padding: 0 12px; border-radius: 12px; background: var(--field); color: var(--dim); font-size: 13px; }

  .preview.bad { color: var(--err); }

  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .msg { min-height: 20px; font-size: 13px; margin-top: 12px; }

  .ava { position: relative; width: 56px; height: 56px; flex: none; display: grid; place-items: center; font-weight: 600; color: var(--primary-ink); background: var(--secondary); overflow: hidden; text-decoration: none; font-size: 18px; border-radius: 50%; }
  .ava img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

  /* cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border-radius: 20px; height: 300px; display: flex; flex-direction: column; padding: 18px; box-shadow: inset 0 0 0 2px transparent; transition: box-shadow 0.15s; }
  .card.has-hearts { box-shadow: inset 0 0 0 2px var(--heart); }
  .card-top { display: flex; gap: 12px; align-items: center; }
  .who { min-width: 0; }
  .dn { font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .un { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .un a { text-decoration: none; } .un a:hover { color: var(--primary); }
  .card .label { margin: 14px 0 6px; }
  .reasons { list-style: none; margin: 0; padding: 0; flex: 1; overflow: hidden; position: relative; cursor: pointer; }
  .reasons::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 32px; background: linear-gradient(transparent, var(--panel)); }
  .reasons li { font-size: 14px; line-height: 1.45; margin-bottom: 8px; color: var(--soft); }
  .reasons .by { color: var(--dim); font-size: 12px; }
  .give { display: flex; gap: 6px; margin-top: 10px; }
  .hb { flex: 1; height: 42px; background: var(--field); border: 0; border-radius: 60px; display: flex; align-items: center; justify-content: center; gap: 2px; color: var(--heart-dim); padding: 0; }
  .hb:hover { color: var(--heart); }
  .hb.on { background: var(--heart); color: var(--primary-ink); }
  .self { margin-top: 10px; height: 42px; display: grid; place-items: center; border-radius: 60px; background: var(--field); color: var(--dim); font-size: 12px; }
  svg.h { width: 14px; height: 14px; display: block; }

  /* tray */
  .tray { position: fixed; left: 0; right: 0; bottom: calc(var(--bar) + env(safe-area-inset-bottom)); background: rgba(18,17,22,0.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); z-index: 20; display: none; }

  .slots { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 8px; align-items: center; }
  .slot { height: 58px; border-radius: 16px; border: 1px dashed var(--line); background: transparent; display: flex; flex-direction: column; justify-content: center; padding: 0 14px; min-width: 0; text-align: left; color: var(--dim); }

  .ranking .ava { width: 36px; height: 36px; font-size: 13px; }

  .preview-bar { position: sticky; top: 0; z-index: 25; background: var(--mint); color: var(--primary-ink); }

<script>
/* ===== SETTINGS ===== */
const VERSION = "0.3.3";
const AT_CLIENT_ID = "b4964d76-d94d-452a-891e-90c7a8d943af";
const WORKER_URL = "https://HIER-DEIN-WORKER.workers.dev";

const params = new URLSearchParams(location.search);
const FAKE = params.has("demo") || location.protocol === "file:" || /claude/.test(location.hostname);
const MODE = FAKE ? "fake" : WORKER_URL.includes("HIER") ? "local" : "live";

/* ===== AUDIOTOOL CONNECTION (as in Pulvball) ===== */
const AT_SCOPE = "user:read";
const AT_API = "https://api.audiotool.com/";
const atRedirect = () => location.origin + location.pathname;
let atSession = null, atSdk = null;

// the NEXUS SDK (@audiotool/nexus 0.0.19, login part only) sits inline at the end of this file
function atLoadSdk() {
  if (!atSdk) {
    const src = document.getElementById("nexusSdk").textContent;
    const url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
    atSdk = import(url).then(m => m.default || m);
  }
  return atSdk;
}
async function atBoot() {
  if (location.protocol === "file:") return null;
  try {
    const sdk = await atLoadSdk();
    const at = await sdk.audiotool({ clientId: AT_CLIENT_ID, redirectUrl: atRedirect(), scope: AT_SCOPE });
    if (at.status === "authenticated") atSession = at;
    else if (at.error) { console.warn("[AT] " + at.error.message); S.serverMsg = "sign in failed: " + at.error.message; }
  } catch (e) { console.warn("[AT] " + (e && e.message)); S.serverMsg = "sign in failed: " + (e && e.message); }
  return atSession;
}
async function atLogin() {
  const sdk = await atLoadSdk();
  const at = await sdk.audiotool({ clientId: AT_CLIENT_ID, redirectUrl: atRedirect(), scope: AT_SCOPE });
  if (at.status === "unauthenticated") { if (at.login) at.login(); return null; }
  atSession = at;
  return at;
}
function atLogout() {
  if (atSession && atSession.logout) atSession.logout();
  atSession = null;
}
function atToken() {
  try { return localStorage.getItem("oidc_" + AT_CLIENT_ID + "_oidc_access_token") || ""; }
  catch (e) { return ""; }
}
function atAccount() { return ((atSession && atSession.userName) || "").toLowerCase(); }
async function atPublic(service, method, body) {
  const r = await fetch(AT_API + service + "/" + method, {
    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(method + " answered " + r.status);
  return r.json();
}
function atUserAusLink(text) {
  const t = String(text || "").trim();
  const m = t.match(/audiotool\.com\/user\/([^\/?#\s]+)/i);
  const n = m ? m[1] : /^[\w.-]+$/.test(t) ? t : "";
  return n ? "users/" + decodeURIComponent(n).toLowerCase() : "";
}
async function atUsers(names) {
  const d = await atPublic("audiotool.user.v1.UserService", "BatchGetUsers", { userNames: names });
  return (d && d.users) || [];
}

/* ===== STATE ===== */
const S = {
  phase: "soon", override: null, dates: {}, rules: { maxReason: 160, maxNominations: 5 },
  nominees: [], results: null,
  me: "", isAdmin: false, votes: {}, nominated: [], allNominees: null,
  profiles: new Map(), server: "wait", serverMsg: "", preview: false
};

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = n => String(n || "").replace(/^users\//, "");
const profileUrl = n => "https://www.audiotool.com/user/" + encodeURIComponent(short(n));
const dname = n => (S.profiles.get(n) && S.profiles.get(n).displayName) || short(n);

function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const HEART = '<svg class="h" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21.2 10.6 20C5.4 15.3 2 12.2 2 8.4 2 5.3 4.4 3 7.4 3c1.8 0 3.5.8 4.6 2.1C13.1 3.8 14.8 3 16.6 3 19.6 3 22 5.3 22 8.4c0 3.8-3.4 6.9-8.6 11.6L12 21.2z"/></svg>';
const hearts = n => HEART.repeat(n);

function avatarHtml(name, cls = "ava", link = false) {
  const p = S.profiles.get(name);
  const label = short(name).slice(0, 2).toUpperCase();
  const tint = "hsl(" + (hash(name) % 360) + " 45% 62%)";
  const inner = p && p.avatarUrl
    ? '<img src="' + esc(p.avatarUrl) + '" alt="" loading="lazy" crossorigin="anonymous" onerror="this.remove()">'
    : "";
  const tag = link ? "a" : "div";
  const href = link ? ' href="' + profileUrl(name) + '" target="_blank" rel="noopener"' : "";
  return "<" + tag + ' class="' + cls + '" style="background:' + tint + '"' + href + ">" + label.replace(/./g, c => esc(c)) + inner + "</" + tag + ">";
}

/* ===== SERVER ===== */
async function api(path, body) {
  if (MODE !== "live") return demoApi(path, body);
  const headers = {};
  const tok = atToken();
  if (tok && atSession) headers.authorization = "Bearer " + tok;
  if (body !== undefined) headers["content-type"] = "application/json";
  const r = await fetch(WORKER_URL + path, {
    method: body === undefined ? "GET" : "POST",
    headers, body: body === undefined ? undefined : JSON.stringify(body)
  });
  let d = null; try { d = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error((d && d.error) || ("server answered " + r.status)); err.status = r.status; throw err; }
  return d;
}

async function loadState() {
  try {
    const d = await api("/state");
    S.phase = d.phase; S.override = d.override; S.dates = d.dates || {}; S.rules = d.rules || S.rules;
    S.nominees = d.nominees || []; S.results = d.results;
    S.server = MODE === "live" ? "ok" : MODE;
  } catch (e) { S.server = "err"; S.serverMsg = e.message; }
}

async function loadMe() {
  S.me = ""; S.isAdmin = false; S.votes = {}; S.nominated = []; S.allNominees = null;
  if (MODE === "fake" ? !demo.signedIn : !atSession) return;
  try {
    const d = await api("/me");
    S.me = d.account; S.isAdmin = !!d.isAdmin; S.votes = d.votes || {}; S.nominated = d.nominated || [];
    S.allNominees = d.allNominees || null;
    delete S.votes.at;
  } catch (e) {
    if (e.status === 401) { S.serverMsg = "server could not verify your login"; }
    else S.serverMsg = e.message;
  }
}

async function loadProfiles(names) {
  const need = [...new Set(names)].filter(n => n && !S.profiles.has(n));
  if (!need.length) return;
  if (MODE === "fake") { for (const n of need) S.profiles.set(n, demo.profiles[n] || { name: n, displayName: short(n) }); return; }
  for (let i = 0; i < need.length; i += 50) {
    try {
      const users = await atUsers(need.slice(i, i + 50));
      for (const u of users) S.profiles.set(String(u.name).toLowerCase(), u);
    } catch (e) { console.warn("[profiles] " + e.message); }
  }
}

async function refresh() {
  await loadState();
  await loadMe();
  const list = (S.isAdmin && S.allNominees) ? S.allNominees : S.nominees;
  const names = [S.me];
  for (const n of list) { names.push(n.name); for (const r of n.reasons) names.push(r.by); }
  if (S.results && S.results.ranking) for (const r of S.results.ranking.slice(0, 50)) names.push(r.name);
  await loadProfiles(names);
  renderAll();
}

/* ===== RENDER ===== */
const PH = () => S.preview ? "vote" : S.phase;

function fmtDate(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}
function left(ms) {
  if (ms <= 0) return "now";
  const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60;
  return d > 0 ? d + "d " + String(h).padStart(2, "0") + "h " + String(m).padStart(2, "0") + "m"
               : String(h).padStart(2, "0") + "h " + String(m).padStart(2, "0") + "m " + String(s).padStart(2, "0") + "s";
}

function renderHeader() {
  const ph = PH();
  const tags = { soon: "Soon", nominate: "Nominations open", vote: "Voting open", ended: "Closed" };
  $("phaseTag").textContent = tags[ph] || ph;
  const steps = [
    ["soon", "Start", S.dates.nominateFrom],
    ["nominate", "Nominate", S.dates.voteFrom],
    ["vote", "Vote", S.dates.voteUntil],
    ["ended", "Winners", ""]
  ];
  $("steps").innerHTML = steps.map(s => '<div class="step' + (s[0] === ph ? " now" : "") + '"><span class="label">' + esc(s[1]) + "</span><small>" +
    (s[2] ? (s[0] === "soon" ? "" : "until ") + esc(fmtDate(s[2])) : "&nbsp;") + "</small></div>").join("");
  tick();
}
function tick() {
  const ph = PH(), now = Date.now();
  const target = { soon: S.dates.nominateFrom, nominate: S.dates.voteFrom, vote: S.dates.voteUntil }[ph];
  const word = { soon: "Opens in", nominate: "Closes in", vote: "Closes in" }[ph];
  $("countdown").innerHTML = target && !S.preview ? word + " <b>" + left(Date.parse(target) - now) + "</b>" : "";
}

function renderAccount() {
  const el = $("account");
  if (S.me) {
    el.innerHTML = '<div class="me">' + avatarHtml(S.me) + "<span>" + esc(dname(S.me)) + '</span></div><button class="btn sec sm" id="btnLogout">Sign out</button>';
    $("btnLogout").onclick = logout;
  } else {
    el.innerHTML = '<button class="btn" id="btnLogin">Sign in</button>';
    $("btnLogin").onclick = login;
  }
}

function renderNominate() {
  $("secNominate").hidden = PH() !== "nominate";
  if (PH() !== "nominate") return;
  $("nomReason").maxLength = S.rules.maxReason;
  updateCounter();
  $("nomMine").textContent = S.me ? S.nominated.length + " / " + S.rules.maxNominations : "";
  $("nomSend").textContent = S.me ? "Nominate" : "Sign in";
}

function visibleList() {
  return (S.isAdmin && S.allNominees) ? S.allNominees : S.nominees;
}
function publicList() {
  return visibleList().filter(n => !n.hidden);
}

function sortedNominees() {
  const list = publicList().slice();
  if (PH() === "vote") {
    const seed = S.me || "guest";
    list.sort((a, b) => hash(seed + a.name) - hash(seed + b.name));
  } else {
    list.sort((a, b) => b.reasons.length - a.reasons.length || ((a.reasons[0] || {}).at || 0) - ((b.reasons[0] || {}).at || 0));
  }
  return list;
}

function cardHtml(n) {
  const isSelf = S.me && n.name === S.me;
  const has = ["3", "2", "1"].some(p => S.votes[p] === n.name);
  const reasons = n.reasons.slice(-3).reverse().map(r =>
    "<li>" + esc(r.text) + '<br><span class="by">' + esc(dname(r.by)) + "</span></li>").join("");
  let give = "";
  if (PH() === "vote") {
    if (isSelf) give = '<div class="self">You</div>';
    else give = '<div class="give">' + ["3", "2", "1"].map(p =>
      '<button class="hb' + (S.votes[p] === n.name ? " on" : "") + '" data-give="' + p + '" data-name="' + esc(n.name) + '" aria-label="' + p + ' hearts">' + hearts(+p) + "</button>").join("") + "</div>";
  }
  return '<article class="card' + (has ? " has-hearts" : "") + '">' +
    '<div class="card-top">' + avatarHtml(n.name, "ava", true) +
    '<div class="who"><div class="dn">' + esc(dname(n.name)) + '</div><div class="un"><a href="' + profileUrl(n.name) + '" target="_blank" rel="noopener">@' + esc(short(n.name)) + "</a></div></div></div>" +
    '<div class="label">' + n.reasons.length + " nomination" + (n.reasons.length === 1 ? "" : "s") + "</div>" +
    '<ul class="reasons" data-more="' + esc(n.name) + '">' + reasons + "</ul>" +
    give + "</article>";
}

function renderGrid() {
  const ph = PH();
  const show = ph === "nominate" || ph === "vote";
  $("secGrid").hidden = !show;
  if (!show) return;
  const list = sortedNominees();
  $("gridCount").textContent = list.length || "";
  $("grid").innerHTML = list.length ? list.map(cardHtml).join("") : '<div class="empty">No nominations yet</div>';
}

function renderTray() {
  const on = PH() === "vote";
  document.body.classList.toggle("with-tray", on);
  if (!on) return;
  const el = $("trayInner");
  if (!S.me) {
    el.innerHTML = '<div class="tray-login"><span class="hs"><span>' + hearts(3) + "</span><span>" + hearts(2) + "</span><span>" + hearts(1) +
      '</span></span><button class="btn" id="trayLogin">Sign in to vote</button></div>';
    $("trayLogin").onclick = login;
    return;
  }
  el.innerHTML = '<div class="slots">' + ["3", "2", "1"].map(p => {
      const who = S.votes[p];
      return '<button class="slot' + (who ? " full" : "") + '" data-take="' + p + '"><span class="hs">' + hearts(+p) + '</span><span class="t">' + (who ? esc(dname(who)) : "&nbsp;") + "</span></button>";
    }).join("") + '<span class="save ' + saveState.cls + '">' + esc(saveState.text) + "</span></div>";
}

function renderResults() {
  $("secResults").hidden = PH() !== "ended";
  if (PH() !== "ended") return;
  const el = $("results");
  const r = S.results;
  if (!r || r.counting) { el.innerHTML = '<div class="empty">Counting</div>'; return; }
  const rk = r.ranking || [];
  if (!rk.length) { el.innerHTML = '<div class="empty">No votes</div>'; return; }
  const medal = ["Gold", "Silver", "Bronze"];
  const pod = i => {
    const x = rk[i]; if (!x) return "<div></div>";
    return '<div class="pod p' + (i + 1) + '"><span class="medal">' + medal[i] + "</span>" + avatarHtml(x.name, "ava", true) +
      '<div class="dn">' + esc(dname(x.name)) + '</div><div class="pts"><b>' + x.points + "</b> pts</div></div>";
  };
  const rest = rk.slice(3).map((x, i) => '<li><span class="pos">' + (i + 4) + "</span>" + avatarHtml(x.name, "ava", true) +
    '<span class="nm">' + esc(dname(x.name)) + '</span><span class="p">' + x.points + " pts</span></li>").join("");
  el.innerHTML = '<div class="podium">' + pod(1) + pod(0) + pod(2) + "</div>" + (rest ? '<ul class="ranking">' + rest + "</ul>" : "");
}

function renderAdmin() {
  $("secAdmin").hidden = !S.isAdmin || S.preview;
  $("previewBar").hidden = !S.preview;
  if (!S.isAdmin || S.preview) return;
  const list = visibleList().slice().sort((a, b) => b.reasons.length - a.reasons.length || dname(a.name).localeCompare(dname(b.name)));
  $("admCount").textContent = list.length || "";
  $("admList").innerHTML = list.length ? list.map(n =>
    '<li class="' + (n.hidden ? "off" : "") + '">' + avatarHtml(n.name, "ava", true) +
    '<span class="nm">' + esc(dname(n.name)) + "<small>@" + esc(short(n.name)) + "</small></span>" +
    '<span class="n">' + n.reasons.length + "</span>" +
    '<button class="btn sec sm" data-more="' + esc(n.name) + '">Reasons</button>' +
    '<button class="btn sec sm" data-hide="' + esc(n.name) + '" data-state="' + (n.hidden ? "0" : "1") + '">' + (n.hidden ? "Show" : "Hide") + "</button></li>").join("")
    : '<li><span class="nm" style="color:var(--dim)">No nominations yet</span></li>';
}

function renderStatus() {
  const dot = S.server === "ok" ? "ok" : (S.server === "fake" || S.server === "local") ? "demo" : S.server === "err" ? "err" : "";
  const srv = S.server === "fake" ? "demo" : S.server === "local" ? "test mode (this browser only)"
    : S.server === "ok" ? "online" : S.server === "err" ? "offline" : "connecting";
  let html = "<b>FA VOTING v" + VERSION + '</b><span><span class="dot ' + dot + '"></span>' + esc(srv) + "</span><span>" + esc(S.phase) + "</span>";
  if (S.serverMsg) html += "<span>" + esc(S.serverMsg) + "</span>";
  if (MODE !== "live") html += '<span class="demo">' + ["soon", "nominate", "vote", "ended"].map(p =>
    '<button data-demo="' + p + '" class="' + (S.phase === p ? "on" : "") + '">' + p + "</button>").join("") +
    (MODE === "fake" ? '<button data-demo="admin" class="' + (demo.admin ? "on" : "") + '">admin</button>' : '<button data-demo="reset">reset</button>') + "</span>";
  $("status").innerHTML = html;
}

function renderAll() {
  renderHeader(); renderAccount(); renderAdmin(); renderNominate(); renderResults(); renderGrid(); renderTray(); renderStatus();
}

/* ===== LOGIN ===== */
function saveDraft() {
  try { sessionStorage.setItem("fav_draft", JSON.stringify({ link: $("nomLink").value, reason: $("nomReason").value })); } catch (e) {}
}
function restoreDraft() {
  try {
    const d = JSON.parse(sessionStorage.getItem("fav_draft") || "null");
    if (d) { $("nomLink").value = d.link || ""; $("nomReason").value = d.reason || ""; sessionStorage.removeItem("fav_draft"); }
  } catch (e) {}
}
async function login() {
  saveDraft();
  if (MODE === "fake") { demo.signedIn = true; await refresh(); restoreDraft(); preview(); return; }
  if (location.protocol === "file:") { alertMsg("sign in only works on the live page"); return; }
  try {
    const at = await atLogin();
    if (at) await refresh();
  } catch (e) { alertMsg("sign in failed: " + (e && e.message)); }
}
async function logout() {
  if (MODE === "fake") demo.signedIn = false; else atLogout();
  await refresh();
}
function alertMsg(t) { S.serverMsg = t; renderStatus(); }

/* ===== NOMINATE ===== */
let previewTimer = null;
function updateCounter() { $("nomCount").textContent = $("nomReason").value.length + " / " + S.rules.maxReason; }

function preview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(async () => {
    const box = $("nomPreview");
    const name = atUserAusLink($("nomLink").value);
    box.className = "preview";
    if (!$("nomLink").value.trim()) { box.textContent = ""; return; }
    if (!name) { box.className = "preview bad"; box.textContent = "Not a profile link"; return; }
    if (S.me && name === S.me) { box.className = "preview bad"; box.textContent = "That's you"; return; }
    box.textContent = "...";
    if (MODE === "fake") { if (!demo.profiles[name]) demo.profiles[name] = { name, displayName: short(name) }; }
    S.profiles.delete(name);
    await loadProfiles([name]);
    const p = S.profiles.get(name);
    if (atUserAusLink($("nomLink").value) !== name) return;
    if (!p) { box.className = "preview bad"; box.textContent = "User not found"; return; }
    const already = visibleList().find(n => n.name === name);
    box.className = "preview found";
    box.innerHTML = avatarHtml(name) + "<div><b>" + esc(p.displayName || short(name)) + '</b><br><span class="label">@' + esc(short(name)) +
      (already ? " / " + already.reasons.length + "x nominated" : "") + "</span></div>";
  }, 350);
}

async function nominate() {
  const msg = $("nomMsg");
  msg.className = "msg"; msg.textContent = "";
  if (!S.me) { await login(); return; }
  const name = atUserAusLink($("nomLink").value);
  const reason = $("nomReason").value.trim();
  if (!name) { msg.className = "msg err"; msg.textContent = "Paste a profile link"; return; }
  if (name === S.me) { msg.className = "msg err"; msg.textContent = "That's you"; return; }
  if (reason.length < 3) { msg.className = "msg err"; msg.textContent = "Add a reason"; return; }
  $("nomSend").disabled = true;
  try {
    const d = await api("/nominate", { nominee: name, reason });
    const nn = d.nominee || name;
    for (const list of [S.nominees, S.allNominees].filter(Boolean)) {
      let entry = list.find(n => n.name === nn);
      if (!entry) { entry = { name: nn, hidden: false, reasons: [] }; list.push(entry); }
      entry.reasons = entry.reasons.filter(r => r.by !== S.me);
      entry.reasons.push({ by: S.me, text: reason, at: Date.now() });
    }
    if (!S.nominated.includes(nn)) S.nominated.push(nn);
    await loadProfiles([nn]);
    $("nomLink").value = ""; $("nomReason").value = ""; preview(); updateCounter();
    msg.className = "msg ok"; msg.textContent = dname(nn) + " nominated";
    renderNominate(); renderGrid(); renderAdmin();
  } catch (e) {
    msg.className = "msg err"; msg.textContent = e.message;
  } finally { $("nomSend").disabled = false; }
}

/* ===== VOTE ===== */
const saveState = { text: "", cls: "" };
let saveTimer = null;
function setSave(text, cls) { saveState.text = text; saveState.cls = cls || ""; renderTray(); }

function changed() {
  renderGrid();
  if (S.preview) { setSave("preview", ""); return; }
  setSave("saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveVotes, 500);
}
function give(points, name) {
  if (!S.me) { login(); return; }
  if (name === S.me) return;
  if (S.votes[points] === name) delete S.votes[points];
  else {
    for (const p of ["3", "2", "1"]) if (S.votes[p] === name) delete S.votes[p];
    S.votes[points] = name;
  }
  changed();
}
function takeBack(points) {
  if (!S.votes[points]) return;
  delete S.votes[points];
  changed();
}
async function saveVotes() {
  try {
    const body = { "3": S.votes["3"] || null, "2": S.votes["2"] || null, "1": S.votes["1"] || null };
    await api("/vote", body);
    setSave("saved", "ok");
  } catch (e) {
    setSave("error", "err"); alertMsg(e.message);
    await loadMe(); renderGrid(); renderTray();
  }
}

/* ===== PREVIEW (admin only, nothing is saved) ===== */
let realVotes = null;
function startPreview() {
  realVotes = Object.assign({}, S.votes);
  S.votes = {};
  S.preview = true; saveState.text = ""; window.scrollTo(0, 0); renderAll();
}
function stopPreview() {
  S.preview = false; S.votes = realVotes || {}; saveState.text = ""; renderAll();
}

/* ===== OVERLAY ===== */
function openReasons(name) {
  const n = visibleList().find(x => x.name === name);
  if (!n) return;
  $("sheetTitle").textContent = dname(name);
  $("sheetBody").innerHTML = "<ul>" + n.reasons.slice().reverse().map(r =>
    "<li>" + esc(r.text) + '<br><a class="by" href="' + profileUrl(r.by) + '" target="_blank" rel="noopener">' + esc(dname(r.by)) + "</a>" +
    (S.isAdmin && !S.preview ? '<button class="x" data-rm="' + esc(name) + '" data-by="' + esc(r.by) + '">remove</button>' : "") + "</li>").join("") + "</ul>";
  $("overlay").classList.add("open");
}
function closeSheet() { $("overlay").classList.remove("open"); }

/* ===== ADMIN ===== */
async function admin(action, body) {
  const m = $("admMsg");
  m.className = "msg"; m.textContent = "";
  try {
    await api("/admin/" + action, body || {});
    await refresh();
  } catch (e) { m.className = "msg err"; m.textContent = e.message; }
}

/* ===== EVENTS ===== */
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-more]");
  if (!t) return;
  if (t.dataset.give) give(t.dataset.give, t.dataset.name);
  else if (t.dataset.take) takeBack(t.dataset.take);
  else if (t.dataset.more) openReasons(t.dataset.more);
  else if (t.dataset.hide) admin("hide", { name: t.dataset.hide, hidden: t.dataset.state === "1" });
  else if (t.dataset.rm) { admin("remove-reason", { name: t.dataset.rm, by: t.dataset.by }); closeSheet(); }
  else if (t.dataset.demo) demoSwitch(t.dataset.demo);
});
$("nomLink").addEventListener("input", preview);
$("nomReason").addEventListener("input", updateCounter);
$("nomSend").addEventListener("click", nominate);
$("sheetClose").addEventListener("click", closeSheet);
$("overlay").addEventListener("click", e => { if (e.target === $("overlay")) closeSheet(); });
$("previewStart").addEventListener("click", startPreview);
$("previewExit").addEventListener("click", stopPreview);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
setInterval(tick, 1000);
setInterval(() => { if (!document.hidden && S.phase !== "vote" && !S.preview) refresh(); }, 60000);

/* ===== OFFLINE BACKEND =====
   "fake":  invented artists and login, nothing saved (preview, or ?demo in the address)
   "local": real Audiotool login and real profiles, saved only in this browser (no worker set yet)
*/
const ADMINS = ["users/sandburgen"];
const LS_KEY = "fav_local_v1";
function lsLoad() {
  if (MODE !== "local") return null;
  try { return JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (e) { return null; }
}
const demo = Object.assign({
  signedIn: false, admin: false,
  phase: ["soon", "nominate", "vote", "ended"].includes(params.get("phase")) ? params.get("phase") : "nominate",
  profiles: {}, noms: [], votes: {}, hidden: []
}, lsLoad() || {});
function lsSave() {
  if (MODE !== "local") return;
  try { localStorage.setItem(LS_KEY, JSON.stringify({ phase: demo.phase, noms: demo.noms, votes: demo.votes, hidden: demo.hidden })); } catch (e) {}
}
const demoMe = () => MODE === "fake" ? "users/you" : atAccount();
const demoIsAdmin = () => MODE === "fake" ? demo.admin : ADMINS.includes(demoMe());

if (MODE === "fake") (function seedDemo() {
  const people = [
    ["users/kelp.unit", "Kelp Unit"], ["users/marta_volt", "Marta Volt"], ["users/nightferry", "Night Ferry"],
    ["users/oblique303", "Oblique 303"], ["users/dustpan", "Dustpan Choir"], ["users/lumen-k", "Lumen K"],
    ["users/grauzone", "Grauzone"], ["users/tapehiss", "Tape Hiss"], ["users/you", "You (demo)"],
    ["users/fennel", "Fennel"], ["users/bitsalt", "Bitsalt"], ["users/mira.o", "Mira O"]
  ];
  for (const [n, d] of people) demo.profiles[n] = { name: n, displayName: d };
  const said = [
    "Every release sounds like a different planet, and the mixdowns are spotless.",
    "Always helps newcomers in the chat and still drops a track every week.",
    "Took the Pulverisateur somewhere I did not know it could go.",
    "Their remix of the community track was the best thing I heard this year.",
    "Consistent, original and never boring. Overdue for a feature.",
    "The sound design alone deserves this.",
    "Low key legend. Listen to the last album front to back."
  ];
  const nominees = people.slice(0, 8).map(p => p[0]);
  const voters = ["users/fennel", "users/bitsalt", "users/mira.o", "users/kelp.unit", "users/grauzone"];
  let i = 0;
  for (const n of nominees) {
    const k = 1 + (hash(n) % 3);
    for (let j = 0; j < k; j++) {
      const by = voters[(i + j) % voters.length];
      if (by !== n) demo.noms.push({ nominee: n, by, text: said[(i + j) % said.length], at: Date.now() - (i * 7 + j) * 36e5 });
    }
    i++;
  }
  for (let v = 0; v < 23; v++) {
    const pick = nominees.slice().sort((a, b) => hash(v + a) - hash(v + b));
    demo.votes["users/demo" + v] = { "3": pick[0], "2": pick[1], "1": pick[2] };
  }
})();

function demoNominees() {
  const map = new Map();
  for (const x of demo.noms) {
    if (!map.has(x.nominee)) map.set(x.nominee, { name: x.nominee, hidden: demo.hidden.includes(x.nominee), reasons: [] });
    map.get(x.nominee).reasons.push({ by: x.by, text: x.text, at: x.at });
  }
  return [...map.values()];
}
function demoResults() {
  const valid = new Set(demoNominees().filter(n => !n.hidden).map(n => n.name));
  const sc = new Map();
  for (const n of valid) sc.set(n, { name: n, points: 0, h3: 0, h2: 0, h1: 0 });
  let voters = 0;
  for (const [voter, v] of Object.entries(demo.votes)) {
    let used = false;
    for (const p of [3, 2, 1]) { const w = v[p]; if (w && valid.has(w) && w !== voter) { sc.get(w).points += p; sc.get(w)["h" + p]++; used = true; } }
    if (used) voters++;
  }
  const ranking = [...sc.values()].sort((a, b) => b.points - a.points || b.h3 - a.h3 || b.h2 - a.h2 || a.name.localeCompare(b.name));
  return { ranking, voters };
}
function demoDates(phase) {
  const now = Date.now(), d = n => new Date(now + n * 864e5).toISOString();
  if (phase === "soon") return { nominateFrom: d(2.04), voteFrom: d(16), voteUntil: d(23) };
  if (phase === "vote") return { nominateFrom: d(-14), voteFrom: d(-2), voteUntil: d(5.08) };
  if (phase === "ended") return { nominateFrom: d(-21), voteFrom: d(-9), voteUntil: d(-2) };
  return { nominateFrom: d(-3), voteFrom: d(4.06), voteUntil: d(11) };
}
async function demoApi(path, body) {
  await new Promise(r => setTimeout(r, 120));
  const fail = (m, s) => { const e = new Error(m); e.status = s || 400; throw e; };
  if (path === "/state") return { phase: demo.phase, override: null, dates: demoDates(demo.phase), rules: { maxReason: 160, maxNominations: 5 },
    nominees: demo.phase === "soon" ? [] : demoNominees().filter(n => !n.hidden), results: demo.phase === "ended" ? demoResults() : null };
  const me = demoMe();
  if (!me || (MODE === "fake" && !demo.signedIn)) fail("please sign in first", 401);
  const admin = demoIsAdmin();
  if (path === "/me") return { account: me, isAdmin: admin, votes: Object.assign({}, demo.votes[me] || {}),
    nominated: demo.noms.filter(x => x.by === me).map(x => x.nominee), allNominees: admin ? demoNominees() : undefined };
  if (path === "/nominate") {
    if (demo.phase !== "nominate") fail("nominations are closed", 403);
    const nominee = String(body.nominee || "").toLowerCase();
    if (nominee === me) fail("you can't nominate yourself");
    if (demo.hidden.includes(nominee)) fail("this artist can't be nominated");
    if (MODE === "local") {
      const users = await atUsers([nominee]).catch(() => []);
      if (!users.length) fail("this Audiotool user does not exist");
    }
    const mine = demo.noms.filter(x => x.by === me);
    const old = mine.find(x => x.nominee === nominee);
    if (!old && mine.length >= 5) fail("you used all 5 nominations", 403);
    demo.noms = demo.noms.filter(x => !(x.by === me && x.nominee === nominee));
    demo.noms.push({ nominee, by: me, text: body.reason, at: Date.now() });
    lsSave();
    return { ok: true, nominee };
  }
  if (path === "/vote") {
    if (demo.phase !== "vote") fail("voting is closed", 403);
    const v = {}; for (const p of ["3", "2", "1"]) if (body[p]) v[p] = body[p];
    if (Object.keys(v).length) demo.votes[me] = v; else delete demo.votes[me];
    lsSave();
    return { ok: true };
  }
  if (path.startsWith("/admin/")) {
    if (!admin) fail("admins only", 403);
    if (path === "/admin/remove-reason") demo.noms = demo.noms.filter(x => !(x.nominee === body.name && x.by === body.by));
    if (path === "/admin/hide") {
      demo.hidden = demo.hidden.filter(n => n !== body.name);
      if (body.hidden) demo.hidden.push(body.name);
    }
    if (path === "/admin/phase") demo.phase = body.phase || "nominate";
    lsSave();
    return { ok: true };
  }
  fail("not found", 404);
}
async function demoSwitch(what) {
  if (what === "admin") { demo.admin = !demo.admin; demo.signedIn = demo.signedIn || demo.admin; }
  else if (what === "reset") {
    if (!confirm("Delete all test nominations and votes in this browser?")) return;
    demo.noms = []; demo.votes = {}; demo.hidden = []; demo.phase = "nominate";
  }
  else demo.phase = what;
  lsSave();
  await refresh();
}

/* ===== START ===== */
(async function start() {
  renderStatus();
  if (MODE !== "fake") await atBoot();
  await refresh();
  restoreDraft();
  if ($("nomLink").value) preview();
  updateCounter();
})();
</script>
</body>
